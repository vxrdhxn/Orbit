<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="gradBg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#2b2b2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e1e;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="gradSphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0083b0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
        <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#gradBg)" />
  
  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.3" transform="rotate(45 256 256)" />
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.3" transform="rotate(-45 256 256)" />
  
  <!-- Active Orbit Path (The "Watching" Path) -->
  <path d="M 383,128 A 180,60 45 0,1 128,383" fill="none" stroke="#00b4db" stroke-width="14" stroke-linecap="round" />
  
  <!-- Central Sphere (The Core) -->
  <circle cx="256" cy="256" r="70" fill="url(#gradSphere)" filter="url(#glow)" />
  
  <!-- Inner Code Symbol -->
  <path d="M 230,230 L 210,256 L 230,282" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 282,230 L 302,256 L 282,282" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="248" y1="290" x2="264" y2="222" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  
  <!-- The Watcher (Satellite) -->
  <circle cx="383" cy="128" r="25" fill="#ff9900" filter="url(#glow)" />
  
</svg>
