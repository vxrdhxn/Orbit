<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF00CC" />
      <stop offset="50%" stop-color="#9900FF" />
      <stop offset="100%" stop-color="#00CCFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g stroke="url(#brainGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(10, 15) scale(0.8)">
    <!-- Left Hemisphere -->
    <path d="M40 10 C 25 10, 10 25, 10 40 C 10 50, 15 65, 30 70 L 38 72 L 40 75 L 42 72 L 40 40 L 40 10 Z" />
    <!-- Right Hemisphere -->
    <path d="M60 10 C 75 10, 90 25, 90 40 C 90 50, 85 65, 70 70 L 62 72 L 60 75 L 58 72 L 60 40 L 60 10 Z" />
    
    <!-- Sulci (Inner lines) Left -->
    <path d="M15 40 Q 25 35, 30 45 T 35 55" />
    <path d="M20 25 Q 30 20, 35 30" />
    
    <!-- Sulci (Inner lines) Right -->
    <path d="M85 40 Q 75 35, 70 45 T 65 55" />
    <path d="M80 25 Q 70 20, 65 30" />
    
    <!-- Connection -->
    <path d="M40 25 L 60 25" stroke-opacity="0.5" stroke-dasharray="3,2" />
    <path d="M40 50 L 60 50" stroke-opacity="0.5" stroke-dasharray="3,2" />

    <!-- Cerebellum / Stem Base -->
    <path d="M40 75 Q 50 85, 60 75" />
  </g>
</svg>
