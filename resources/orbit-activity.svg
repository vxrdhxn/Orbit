           fill="none" stroke="#c5c5c5" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="3.2" fill="#c5c5c5"/>
  <circle cx="18.87" cy="5.79" r="2.2" fill="#c5c5c5"/>
</svg>
