<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Orbit AI: a planet with a satellite on a tilted orbit.
       Plain shapes only (no masks or filters): VS Code tints activity-bar icons
       by using the SVG as a mask, which does not support every SVG feature. -->
