<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00CC" />
      <stop offset="50%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#00CCFF" />
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g stroke="url(#neonGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)">
    
    <path d="M45,85 
             C30,85 15,75 15,50 
             C15,30 30,15 50,15 
             C70,15 85,25 85,50 
             C85,65 75,75 65,75" />
             
    <path d="M55,85 L50,92 L45,85" />

    <path d="M25,50 L40,50 L50,40 L70,40" />
    
    <path d="M50,40 L50,25" />
    <path d="M70,40 L70,30" />
    
    <path d="M40,50 L40,65" />
    <path d="M60,60 L65,70" />

    <circle cx="25" cy="50" r="1.5" fill="url(#neonGradient)" stroke="none" />
    <circle cx="50" cy="25" r="1.5" fill="url(#neonGradient)" stroke="none" />
    <circle cx="70" cy="30" r="1.5" fill="url(#neonGradient)" stroke="none" />
    <circle cx="40" cy="65" r="1.5" fill="url(#neonGradient)" stroke="none" />
    <circle cx="65" cy="70" r="1.5" fill="url(#neonGradient)" stroke="none" />
    <circle cx="30" cy="35" r="1" fill="url(#neonGradient)" stroke="none" />
    <circle cx="75" cy="50" r="1" fill="url(#neonGradient)" stroke="none" />
